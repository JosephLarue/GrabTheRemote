services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gtr
      POSTGRES_PASSWORD: gtr
      POSTGRES_DB: gtr
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
volumes:
  pgdata:
